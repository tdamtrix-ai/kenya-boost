<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f0f0f;color:white;font-family:Arial;margin:0;padding:10px}
.header{background:linear-gradient(90deg,#0066ff,#00cc99,#ff0044);padding:20px;border-radius:20px;text-align:center;font-weight:bold;font-size:22px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:15px 0}
.filters button{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:white;white-space:nowrap}
.filters button.active{background:#0088ff;border-color:#0088ff}
.services-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:12px;text-align:center}
.card.best{border-color:#ffcc00}
.card input{width:90%;margin:8px 0;padding:8px;border-radius:8px;border:1px solid #444;background:#222;color:white;text-align:center}
.price{font-size:20px;font-weight:bold;margin:5px 0}
.buy{width:100%;background:#0088ff;color:white;border:none;padding:10px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>

<div class="header">KENYA BOOST AUTO<br><small style="font-size:10px">TikTok • FB • YouTube • Telegram • IG • X • Spotify • Boomplay • Audiomack<br>AUTO DELIVERY • LIPA NA M-PESA • 0-5MIN START</small></div>

<div class="filters">
<button class="active">ALL 🔥</button>
<button>SOCIAL 📱</button>
<button>MUSIC 🎵</button>
<button>VIDEO ▶️</button>
</div>

<div class="filters">
<button class="active">📱 TikTok</button>
<button>📘 Facebook</button>
<button>📸 Instagram</button>
<button>🐦 Twitter/X</button>
<button>▶️ YouTube</button>
<button>✈️ Telegram</button>
<button>🎵 Spotify</button>
<button>💥 Boomplay</button>
<button>🔥 Audiomack</button>
</div>

<div class="services-grid" id="grid"></div>

<script>
// ===== BEI ZAKO ULIOTAKA =====
const rates = {
  'tiktok_followers': 1.58, // 50=79 => 1.58
  'fb_likes': 0.10, // 100=10
  'ig_likes': 0.10,
  'followers_all': 0.20, // 100=20
  'yt_subs_small': 1.6, // 50=80
  'yt_subs_big': 4.0, // 500=2000, 1k=3999
  'comments': 5,
  'watchtime': 2.2 // 1k hours=2200
};

function createCard(title, baseQty, basePrice, type){
  const rate = type==='likes'?0.10 : type==='followers'?0.20 : type==='yt'?1.6 : 1.58;
  return `
  <div class="card">
    <div style="color:#0088ff;font-size:11px">${title}</div>
    <div style="font-size:12px">${baseQty} Followers</div>
    <div class="price" id="price-${title}">${basePrice} KSH</div>
    <input type="number" placeholder="Weka idadi: 67" oninput="calc(this, '${title}', ${rate})" min="1">
    <div style="font-size:10px;color:#aaa">Ex: 27, 67, 438, 100000</div>
    <button class="buy" onclick="alert('Order: '+document.getElementById('input-${title}').value)">BUY BOOST ⚡</button>
  </div>`;
}

function calc(input, title, rate){
  let qty = parseInt(input.value);
  if(!qty || qty<1) return;
  let price = Math.ceil(qty * rate);
  // minimums kama ulivyotaka
  if(rate==0.10 && price<10) price=10;
  if(rate==0.20 && price<20) price=20;
  if(rate==1.6 && price<80) price=80;
  document.getElementById('price-'+title).innerText = price + ' KSH ( ~'+qty+' )';
}

// Tengeneza cards zote
let html = '';
html+=createCard('TIKTOK', '50', '79', 'followers');
html+=createCard('TIKTOK', '200', '199', 'followers');
html+=createCard('TIKTOK', '500', '399', 'followers');
html+=createCard('TIKTOK', '1K', '699', 'followers');
html+=createCard('TIKTOK', '2K', '1299', 'followers');
html+=createCard('TIKTOK', '5K', '2999', 'followers');
// Ongeza FB, IG, YT, etc vivyo hivyo
html+=createCard('FB LIKES', '100', '10', 'likes');
html+=createCard('IG LIKES', '100', '10', 'likes');
html+=createCard('YOUTUBE', '50 Subs', '80', 'yt');
html+=createCard('TELEGRAM', '100', '30', 'followers');

document.getElementById('grid').innerHTML = html;
</script>
</body>
</html>
