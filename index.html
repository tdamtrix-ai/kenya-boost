<script>
const API_KEY = "ce404945aeb4f5fac83b0cb20599c549";
const API_URL = "https://smmstone.com/api/v2";

async function apiCall(params){
  let fd = new FormData();
  for(let k in params) fd.append(k, params[k]);
  // proxy to bypass CORS
  let r = await fetch("https://corsproxy.io/?" + encodeURIComponent(API_URL), {method:"POST", body:fd});
  // fallback if proxy down, try direct
  if(!r.ok) r = await fetch(API_URL, {method:"POST", body:fd});
  return r.json();
}

async function loadBalance(){
  try{
    let d = await apiCall({key:API_KEY, action:"balance"});

    else document.getElementById('bal').innerText = "Weka $5";
  }catch(e){document.getElementById('bal').innerText = "Check Balance";}
}
loadBalance();

}
